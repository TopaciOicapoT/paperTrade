name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/topacioicapot/papertrade

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Copy production files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml,config"
          target: "/opt/papertrade"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e
            cd /opt/papertrade
            if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
              echo "GHCR_USERNAME and GHCR_TOKEN must be configured in GitHub Actions secrets"
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            COMPOSE="docker compose"
            if command -v docker-compose >/dev/null 2>&1; then COMPOSE="docker-compose"; fi
            $COMPOSE -f docker-compose.prod.yml pull api
            $COMPOSE -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/docs >/dev/null; then
                ready=1
                echo "API ready on attempt $attempt"
                break
              fi
              echo "API not ready yet (attempt $attempt/30); waiting 2s"
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "API failed readiness check; container status:"
              $COMPOSE -f docker-compose.prod.yml ps
              echo "API logs:"
              $COMPOSE -f docker-compose.prod.yml logs --tail=200 api
              exit 1
            fi