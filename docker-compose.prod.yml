services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: papertrade
      POSTGRES_USER: papertrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrade -d papertrade"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/topacioicapot/papertrade:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://papertrade:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/papertrade
    ports:
      - "8000:8000"
    volumes:
      - bot_logs:/app/logs
      - bot_models:/app/models/saved
      - ./config:/app/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/docs'', timeout=3)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  bot_logs:
  bot_models:
